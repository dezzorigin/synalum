name: CI

# CI untuk synalum (repo P1 #56 — full-stack JS: Express + SQLite API,
# React + Vite client, showcase statis). Variasi sesuai stack: tes API
# end-to-end (node:test, server asli + SQLite sementara), build + lint
# client mode demo, Playwright e2e desktop + Pixel 7 (video tur + screenshot
# README sebagai artifact), advisory-sweep OSV (3 lockfile), gate P0
# anti-slop + gitleaks riwayat penuh, dan smoke dist/ (persis yang
# di-deploy ke Pages — termasuk tag OG + og-image.png).
# Node 24. Runner di-pin ubuntu-24.04: Playwright 1.55 tidak mendukung
# ubuntu 26.04 (pola #53). Playwright TIDAK ada di package.json/lock:
# job e2e meng-install dengan `npm install --no-save` (pola #53).
# JANGAN pakai `npm audit` sebagai gate dan JANGAN pakai `| tee` tanpa
# pipefail (menutupi exit code).
on:
  push:
    branches: [main, feat/proper]
  pull_request:
    branches: [main]

jobs:
  # ── Tes API end-to-end (server asli + SQLite sementara) ────────────────
  api-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: synalum-api/package-lock.json

      - name: Install dependencies (API)
        working-directory: synalum-api
        run: npm ci

      - name: Run API tests
        working-directory: synalum-api
        run: npm test

  # ── Build + lint client (mode demo = yang di-deploy ke Pages) ──────────
  client-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: synalum-client/package-lock.json

      - name: Install dependencies (client)
        working-directory: synalum-client
        run: npm ci

      - name: Lint
        working-directory: synalum-client
        run: npm run lint

      - name: Build (mode demo)
        working-directory: synalum-client
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"

      - name: Pastikan dist/ berisi hasil build + OG
        working-directory: synalum-client
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/og-image.png
          grep -q 'og:title' dist/index.html
          grep -q 'twitter:card' dist/index.html
          grep -q 'synalum.pages.dev/og-image.png' dist/index.html

      - name: Unggah dist/ sebagai artifact (untuk deploy Pages dari VM)
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: synalum-client/dist/
          if-no-files-found: error

  # ── Pemeriksaan statis: gate P0 + gitleaks riwayat penuh ───────────────
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Gate anti-slop P0 + kejujuran data
        run: node scripts/check-p0.mjs

      - name: Gitleaks (riwayat penuh)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Advisory sweep OSV (3 lockfile, produksi saja) ─────────────────────
  advisory-sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OSV sweep (produksi saja, HIGH/CRITICAL = gagal)
        run: python3 scripts/advisory-sweep.py

  # ── Playwright e2e desktop + Pixel 7 (build demo) ──────────────────────
  playwright-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: synalum-client/package-lock.json

      - name: Install dependencies (client)
        working-directory: synalum-client
        run: npm ci

      - name: Install Playwright (hanya node_modules, tanpa lock)
        working-directory: synalum-client
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium (hanya di CI — JANGAN di VM dev)
        working-directory: synalum-client
        run: npx playwright install --with-deps chromium

      - name: Build (mode demo)
        working-directory: synalum-client
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"

      - name: Jalankan e2e
        working-directory: synalum-client
        run: npx playwright test
        env:
          CI: "true"

      - name: Ubah video tur (webm) menjadi mp4 untuk README
        if: always()
        working-directory: synalum-client
        run: |
          set -euo pipefail
          echo "--- webm yang ditemukan ---"
          find test-results -name '*.webm' || true
          TOUR_WEBM=$(find test-results -name '*.webm' | head -n 1 || true)
          if [ -z "${TOUR_WEBM}" ]; then
            echo "GAGAL: tidak ada video webm di test-results — periksa konfigurasi video Playwright"
            exit 1
          fi
          # ffmpeg bawaan Playwright (sudah diunduh langkah "Install Chromium"),
          # JANGAN apt-get: apt di runner pernah menggantung >13 menit (run
          # 44538248900). Fallback: ffmpeg sistem bila ada.
          FFMPEG_BIN=$(command -v ffmpeg || find "$HOME/.cache/ms-playwright" -path '*ffmpeg*' -name ffmpeg -type f 2>/dev/null | head -n 1 || true)
          if [ -z "${FFMPEG_BIN}" ]; then
            echo "GAGAL: ffmpeg tidak ditemukan (bukan di PATH, bukan di cache Playwright)"
            exit 1
          fi
          echo "ffmpeg: ${FFMPEG_BIN}"
          mkdir -p e2e/media
          timeout 180 "${FFMPEG_BIN}" -y -loglevel error -i "${TOUR_WEBM}" -vf "scale=1280:-2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart e2e/media/demo.mp4
          echo "demo.mp4 dibuat dari ${TOUR_WEBM}"
          ls -la e2e/media/

      - name: Unggah media e2e (screenshot + video demo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-media
          path: |
            synalum-client/e2e/shots/
            synalum-client/e2e/media/
          if-no-files-found: warn

  # ── Smoke: dist/ hasil build + health API lokal ────────────────────────
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: synalum-api/package-lock.json

      - name: Install dependencies (API)
        working-directory: synalum-api
        run: npm ci

      - name: Smoke API (health + register + login + feed, DB sementara)
        working-directory: synalum-api
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { spawn } from 'node:child_process';
            import assert from 'node:assert/strict';
            import { mkdtemp } from 'node:fs/promises';
            import { tmpdir } from 'node:os';
            import { join } from 'node:path';
            const dir = await mkdtemp(join(tmpdir(), 'synalum-smoke-'));
            const PORT = '18799';
            const BASE = 'http://127.0.0.1:' + PORT;
            const server = spawn('node', ['server.js'], { cwd: '.', env: { ...process.env, PORT, JWT_SECRET: 'smoke-synalum-ci', SYNALUM_DB_PATH: join(dir, 'smoke.db') }, stdio: 'pipe' });
            try {
              let up = false;
              for (let i = 0; i < 40; i++) { try { const r = await fetch(BASE + '/api/health'); if (r.ok) { up = true; break; } } catch {} await new Promise(r => setTimeout(r, 250)); }
              assert.ok(up, 'API tidak hidup');
              const reg = await fetch(BASE + '/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'smoke@usk.ac.id', password: 'rahasia1', role: 'mahasiswa' }) });
              assert.equal(reg.status, 201);
              const login = await fetch(BASE + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'smoke@usk.ac.id', password: 'rahasia1' }) });
              assert.equal(login.status, 200);
              const { token } = await login.json();
              const feed = await fetch(BASE + '/api/opportunities/all', { headers: { Authorization: 'Bearer ' + token } });
              assert.equal(feed.status, 200);
              console.log('smoke: health + register + login + feed OK');
            } finally { server.kill(); }
          "
